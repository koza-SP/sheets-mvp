<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheets MVP — 最小疎通ストア</title>
<style>
  :root{
    --indigo:#38397A; --indigo-hover:#2c2d63; --indigo-50:#EEF0FA;
    --green:#3A903A; --bg:#F5F6F8; --card:#FFFFFF; --border:#E4E6EA;
    --text-high:#181A1F; --text-med:#666B76; --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text-high);}
  header{background:#fff;border-bottom:1px solid var(--border);padding:20px 28px;}
  header h1{font-size:18px;font-weight:800;}
  header p{font-size:12px;color:var(--text-med);margin-top:4px;}
  main{max-width:960px;margin:0 auto;padding:28px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .card img{width:100%;height:160px;object-fit:cover;display:block;}
  .card .body{padding:14px;}
  .card h3{font-size:14px;font-weight:700;margin-bottom:6px;}
  .card p{font-size:12px;color:var(--text-med);margin-bottom:10px;min-height:32px;}
  .card .price{font-size:16px;font-weight:800;margin-bottom:10px;}
  .buy-btn{width:100%;background:var(--indigo);color:#fff;border:none;padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
  .buy-btn:hover{background:var(--indigo-hover);}
  .buy-btn:disabled{opacity:.5;cursor:not-allowed;}
  #status{margin-top:16px;font-size:13px;padding:10px 14px;border-radius:8px;display:none;}
  #status.ok{display:block;background:#E8F3E8;color:var(--green);}
  #status.err{display:block;background:#FBEAE8;color:#C0392B;}
</style>
</head>
<body>
  <header>
    <h1>Sheets MVP — 最小疎通ストア</h1>
    <p>静的ファイルのみ(サーバー無し)+ Stripe Payment Link(test mode、恒久URL)による疎通確認用。GitHub Pagesで公開。</p>
  </header>
  <main>
    <div id="status"></div>
    <div class="grid" id="product-grid"></div>
  </main>

  <script>
    // 2026-09-26改訂: api/checkout.js(Vercel Serverless)を廃止し、
    // Stripe Payment Link(事前にAPIで作成済み、Stripe側で恒久ホストされるURL)への
    // 直接リンクに変更。これによりバックエンド無しの純粋な静的サイトになり、
    // GitHub Pages等どこにでもデプロイでき、Vercelアカウントへの依存が無くなった。
    //
    // 2026-09-26再改訂: config.jsonにappsScriptUrlが設定されていれば、静的JSONの代わりに
    // Google Apps Script経由でスプレッドシート(Productsシート)から動的に商品データを取得する。
    // 取得失敗時(未設定 or CORS等のエラー)は静的JSONへ自動フォールバックし、サイトが
    // 壊れないようにする("スプレッドシートベースのアプリケーション化"の実体、Yu作業ゼロで有効化)。
    async function loadProducts() {
      let data;
      try {
        const configRes = await fetch('./data/config.json');
        const config = await configRes.json();
        if (config.appsScriptUrl) {
          const dynamicRes = await fetch(`${config.appsScriptUrl}?action=products`);
          const dynamicJson = await dynamicRes.json();
          if (dynamicJson.success && Array.isArray(dynamicJson.products) && dynamicJson.products.length > 0) {
            data = { products: dynamicJson.products, source: 'google-sheets (dynamic)' };
          }
        }
      } catch (e) {
        console.warn('動的取得(Googleスプレッドシート)に失敗、静的JSONにフォールバック:', e.message);
      }
      if (!data) {
        const res = await fetch('./data/products.json');
        data = await res.json();
      }
      console.log('商品データソース:', data.source);
      const grid = document.getElementById('product-grid');
      grid.innerHTML = data.products.map(p => `
        <div class="card">
          <img src="${p.imageUrl}" alt="${p.name}">
          <div class="body">
            <h3>${p.name}</h3>
            <p>${p.description}</p>
            <div class="price">¥${p.priceJpy.toLocaleString()}</div>
            <a class="buy-btn" href="${p.paymentLinkUrl}" style="display:block;text-align:center;text-decoration:none;">購入(test決済)</a>
          </div>
        </div>
      `).join('');
    }

    // 決済完了後のリダイレクト確認(?success=1&session_id=xxx / ?canceled=1)
    // 2026-09-26改訂: Payment Linkのafter_completionに{CHECKOUT_SESSION_ID}テンプレート変数を
    // 追加し、実際の注文番号(Stripe Checkout Session ID)を購入完了画面に表示できるようにした。
    (function checkReturnStatus() {
      const params = new URLSearchParams(window.location.search);
      const statusEl = document.getElementById('status');
      const sessionId = params.get('session_id');
      if (params.get('success') === '1') {
        statusEl.className = 'ok';
        const idLine = sessionId && !sessionId.startsWith('{')
          ? `<br><span style="font-family:ui-monospace,monospace;font-size:11px;">注文番号: ${sessionId}</span>`
          : '';
        statusEl.innerHTML = `✓ 決済が完了しました(test mode)。${idLine}<br>この注文はGoogleスプレッドシートに記録される設計です(Apps Script接続完了後に有効化)。`;
      } else if (params.get('canceled') === '1') {
        statusEl.className = 'err';
        statusEl.textContent = '決済がキャンセルされました。';
      }
    })();

    loadProducts();
  </script>
</body>
</html>
